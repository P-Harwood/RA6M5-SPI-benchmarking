CONFIG_SPI=y
CONFIG_SPI_INTERRUPT=y
CONFIG_SPI_RA_DTC=y

CONFIG_SERIAL=y
CONFIG_UART_USE_RUNTIME_CONFIGURE=y
CONFIG_UART_ASYNC_API=y

CONFIG_PWM=y

CONFIG_SPEED_OPTIMIZATIONS=y

CONFIG_CBPRINTF_FP_SUPPORT=y

CONFIG_MAIN_STACK_SIZE=2048

CONFIG_TICKLESS_KERNEL=n
CONFIG_SYS_CLOCK_TICKS_PER_SEC=10000


CONFIG_FLASH=y
CONFIG_FLASH_RENESAS_RA_QSPI=y
CONFIG_SOC_FLASH_RENESAS_RA_HP=n

# Needed if using memory protection to stop caching of QSPI registers, memory addresses defined in overlay
CONFIG_ARM_MPU=y 

CONFIG_MAIN_THREAD_PRIORITY=6